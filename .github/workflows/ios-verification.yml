name: iOS verification

on:
  pull_request:
    paths:
      - ".github/workflows/ios-verification.yml"
      - "scripts/verify-ios.sh"
      - "justnoise.xcodeproj/**"
      - "justnoiseradio/**"
      - "justnoiseradioTests/**"
      - "JustNoiseWidget/**"
      - "JustNoiseFocusMonitor/**"
      - "ShieldConfigurationExtension/**"
      - "*.entitlements"
      - "AppIconJN.icon/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-verification.yml"
      - "scripts/verify-ios.sh"
      - "justnoise.xcodeproj/**"
      - "justnoiseradio/**"
      - "justnoiseradioTests/**"
      - "JustNoiseWidget/**"
      - "JustNoiseFocusMonitor/**"
      - "ShieldConfigurationExtension/**"
      - "*.entitlements"
      - "AppIconJN.icon/**"
  workflow_dispatch:

concurrency:
  group: ios-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Release build and tests
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Restore Swift package cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/justnoise-source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('justnoise.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and test
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/justnoise-derived-data
          SPM_CACHE_PATH: ${{ runner.temp }}/justnoise-source-packages
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/justnoise-test-results.xcresult
        run: bash scripts/verify-ios.sh

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: justnoise-test-results
          path: ${{ runner.temp }}/justnoise-test-results.xcresult
          if-no-files-found: ignore
          retention-days: 7
