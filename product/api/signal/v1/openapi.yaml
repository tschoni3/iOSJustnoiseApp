{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "JustNoise Signal API",
    "version": "1.0.0",
    "description": "Frozen V1 contract for the stateless JustNoise Signal backend. The file uses JSON syntax, which is valid YAML 1.2, so contract tests can parse it without adding a YAML dependency."
  },
  "paths": {
    "/captures": {
      "post": {
        "operationId": "createCaptureAnalysis",
        "summary": "Analyze one locally owned Capture",
        "description": "Accepts the canonical multipart payload sent by the native clients. The backend stores no Capture data. A successful response is applied only when baseMemoryRevision exactly matches local state; operationId and every memory operationId are deterministic idempotency keys.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "$ref": "#/components/schemas/CaptureRequest"
              },
              "examples": {
                "canonical": {
                  "externalValue": "./fixtures/request.json"
                }
              },
              "encoding": {
                "audio": {
                  "contentType": "audio/mp4, audio/x-m4a, audio/mpeg, audio/wav"
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The Capture was processed. Silence and safety holds are successful responses, not errors.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CaptureResponse"
                },
                "examples": {
                  "comment": {
                    "externalValue": "./fixtures/comment.json"
                  },
                  "existingThread": {
                    "externalValue": "./fixtures/existing-thread.json"
                  },
                  "silence": {
                    "externalValue": "./fixtures/silence.json"
                  },
                  "safetyHold": {
                    "externalValue": "./fixtures/safety-hold.json"
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "429": {
            "description": "The account or upstream analysis quota is temporarily limited.",
            "headers": {
              "Retry-After": {
                "description": "Seconds until a locally enforced account limit may be retried, when available.",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "503": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Supabase access token"
      }
    },
    "responses": {
      "ErrorResponse": {
        "description": "The request could not be processed. The recording remains local to the client.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            },
            "examples": {
              "unauthenticated": {
                "externalValue": "./fixtures/error.json"
              }
            }
          }
        }
      }
    },
    "schemas": {
      "CaptureRequest": {
        "type": "object",
        "description": "Canonical clients MUST keep duplicated memory values equal: memory_revision equals memory.memoryRevision, threads equals memory.threads, all_known_threads equals memory.allKnownThreads, existing_comments equals memory.existingComments, and thread_links equals memory.threadLinks. The V1 runtime gives explicit multipart values precedence for revision, comments, all-known threads, and links. It merges thread lists in memory, threads, then all_known_threads order with topic-key deduplication. Equality prevents transport-dependent results.",
        "additionalProperties": false,
        "required": [
          "audio",
          "selected_mode",
          "language",
          "capture_id",
          "insight_mode",
          "memory_revision",
          "recent_captures",
          "existing_signals",
          "existing_comments",
          "threads",
          "all_known_threads",
          "thread_links",
          "memory"
        ],
        "properties": {
          "audio": {
            "type": "string",
            "format": "binary",
            "description": "The Capture audio. The production contract requires this field; text fallback is a development-only server option."
          },
          "selected_mode": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "language": {
            "type": "string",
            "minLength": 1,
            "maxLength": 20
          },
          "capture_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{8,64}$",
            "description": "Client-generated stable Capture identifier."
          },
          "insight_mode": {
            "type": "string",
            "enum": [
              "automatic",
              "manual"
            ]
          },
          "memory_revision": {
            "type": "string",
            "pattern": "^[0-9]+$",
            "description": "Base local memory revision encoded as a multipart string."
          },
          "recent_captures": {
            "type": "string",
            "contentMediaType": "application/json",
            "contentSchema": {
              "$ref": "#/components/schemas/RecentCaptureContextArray"
            },
            "description": "JSON-encoded array of recent local Capture context."
          },
          "existing_signals": {
            "type": "string",
            "contentMediaType": "application/json",
            "contentSchema": {
              "$ref": "#/components/schemas/ExistingSignalContextArray"
            },
            "description": "JSON-encoded array of already surfaced local Signals."
          },
          "existing_comments": {
            "type": "string",
            "contentMediaType": "application/json",
            "contentSchema": {
              "$ref": "#/components/schemas/ExistingCommentContextArray"
            },
            "description": "JSON-encoded array of existing local comments."
          },
          "threads": {
            "type": "string",
            "contentMediaType": "application/json",
            "contentSchema": {
              "$ref": "#/components/schemas/MemoryThreadContextArray"
            },
            "description": "JSON-encoded array of the most relevant local topic threads."
          },
          "all_known_threads": {
            "type": "string",
            "contentMediaType": "application/json",
            "contentSchema": {
              "$ref": "#/components/schemas/MemoryThreadContextArray"
            },
            "description": "JSON-encoded array of all bounded local thread context."
          },
          "thread_links": {
            "type": "string",
            "contentMediaType": "application/json",
            "contentSchema": {
              "$ref": "#/components/schemas/ThreadLinkContextArray"
            },
            "description": "JSON-encoded array of local thread links."
          },
          "memory": {
            "type": "string",
            "contentMediaType": "application/json",
            "contentSchema": {
              "$ref": "#/components/schemas/MemoryContext"
            },
            "description": "JSON-encoded V1 local memory context, including memoryRevision."
          }
        }
      },
      "RecentCaptureContextArray": {
        "type": "array",
        "maxItems": 10,
        "items": {
          "$ref": "#/components/schemas/RecentCaptureContext"
        }
      },
      "RecentCaptureContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "capture_id",
          "created_at",
          "summary",
          "themes"
        ],
        "properties": {
          "capture_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "summary": {
            "type": "string"
          },
          "themes": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "sourceLanguage": {
            "type": "string"
          },
          "emotion": {
            "type": "string"
          },
          "strongQuote": {
            "type": "string"
          },
          "transcript": {
            "type": "string"
          },
          "clarifiedTranscript": {
            "type": "string"
          },
          "context": {
            "type": "string"
          },
          "tension": {
            "type": "string"
          },
          "highlight": {
            "type": "string"
          },
          "signalStrength": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          "emotionalIntensity": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          }
        }
      },
      "ExistingSignalContextArray": {
        "type": "array",
        "maxItems": 10,
        "items": {
          "$ref": "#/components/schemas/ExistingSignalContext"
        }
      },
      "ExistingSignalContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "type",
          "text",
          "created_at",
          "source_capture_ids",
          "themes",
          "origin",
          "reveal_state"
        ],
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "type": {
            "type": "string",
            "minLength": 1
          },
          "text": {
            "type": "string",
            "minLength": 1
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "source_capture_ids": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "themes": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "origin": {
            "type": "string"
          },
          "reveal_state": {
            "type": "string"
          },
          "revealed_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ExistingCommentContextArray": {
        "type": "array",
        "maxItems": 30,
        "items": {
          "$ref": "#/components/schemas/ExistingCommentContext"
