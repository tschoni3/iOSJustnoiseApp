          },
          "captureIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "evidenceQuotes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EvidenceQuote"
            }
          }
        }
      },
      "ThreadLinkContextArray": {
        "type": "array",
        "maxItems": 30,
        "items": {
          "$ref": "#/components/schemas/ThreadLinkContext"
        }
      },
      "ThreadLinkContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "sourceThreadId",
          "targetThreadId"
        ],
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "sourceThreadId": {
            "type": "string",
            "minLength": 1
          },
          "targetThreadId": {
            "type": "string",
            "minLength": 1
          },
          "relationship": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "type": "string"
          }
        }
      },
      "MemoryContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version",
          "source",
          "memoryRevision",
          "threads",
          "allKnownThreads",
          "threadLinks",
          "existingComments",
          "categories"
        ],
        "properties": {
          "version": {
            "type": "string",
            "const": "v1"
          },
          "source": {
            "type": "string",
            "minLength": 1
          },
          "memoryRevision": {
            "type": "integer",
            "minimum": 0
          },
          "narrativeSummary": {
            "type": "string"
          },
          "threads": {
