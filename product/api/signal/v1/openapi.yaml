            "minimum": 1
          },
          "intensity": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "maximum": 1
          },
          "intensityTrend": {
            "type": [
              "string",
              "null"
            ]
          },
          "firstSeen": {
            "type": "string",
            "format": "date-time"
          },
          "lastSeen": {
            "type": "string",
            "format": "date-time"
          },
          "captureIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "evidenceQuotes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EvidenceQuote"
            }
          },
          "state": {
            "type": "string"
          },
          "commentState": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "EvidenceQuote": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "captureId",
          "quote"
        ],
        "properties": {
          "captureId": {
            "type": "string"
          },
          "quote": {
            "type": "string"
          }
        }
      },
      "CommentDecision": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "shouldShow",
          "shouldCreate",
          "reason",
          "blockReason",
          "hat",
          "path"
        ],
        "properties": {
          "type": {
            "$ref": "#/components/schemas/Hat"
          },
          "shouldShow": {
            "type": "boolean"
          },
          "shouldCreate": {
            "type": "boolean"
          },
          "reason": {
            "type": "string",
            "minLength": 1
          },
          "blockReason": {
            "type": [
              "string",
              "null"
            ]
          },
          "hat": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/VisibleHat"
              },
              {
                "type": "null"
              }
            ]
          },
          "path": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/CommentPath"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "Safety": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "isSafe",
          "blocked",
          "hold",
          "reason",
          "categories"
        ],
        "properties": {
          "isSafe": {
            "type": "boolean"
          },
          "blocked": {
            "type": "boolean"
          },
          "hold": {
            "type": "boolean"
          },
          "reason": {
            "type": [
              "string",
              "null"
            ]
          },
          "categories": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Comment": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "anchorCaptureId",
          "text",
          "hat",
          "path",
          "createdAt",
          "threadIds",
          "sourceCaptureIds",
          "state"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^comment-[0-9a-f]{32}$"
          },
          "anchorCaptureId": {
            "type": "string"
          },
          "text": {
            "type": "string",
            "minLength": 1
          },
          "hat": {
            "$ref": "#/components/schemas/VisibleHat"
          },
          "path": {
            "$ref": "#/components/schemas/CommentPath"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "threadIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "sourceCaptureIds": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "string"
            }
          },
          "state": {
            "type": "string",
            "const": "visible"
          }
        }
      },
      "Hat": {
        "type": "string",
        "enum": [
          "mirror",
          "anchor",
          "question",
          "pattern",
          "action",
          "reframe",
          "silence"
        ]
      },
      "VisibleHat": {
        "type": "string",
        "enum": [
          "mirror",
          "anchor",
          "question",
          "pattern",
          "action",
          "reframe"
        ]
      },
      "CommentPath": {
        "type": "string",
        "enum": [
          "state_moment",
          "narrative_change"
        ]
      },
      "Category": {
        "type": "string",
        "enum": [
          "work",
          "money_security",
          "health_body",
          "relationships",
          "creativity_identity",
          "emotions_mind",
          "projects_execution",
          "life_direction",
          "uncategorized"
        ]
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string",
            "minLength": 1
          },
          "code": {
            "type": "string",
            "enum": [
              "secure_transport_required",
              "rate_limited",
              "unauthenticated",
              "auth_unavailable",
              "quota_unavailable",
              "signal_engine_unavailable"
            ]
          }
        }
      }
    }
  }
}
