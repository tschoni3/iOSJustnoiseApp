      },
      "CaptureResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "contractVersion",
          "engineVersion",
          "operationId",
          "baseMemoryRevision",
          "nextMemoryRevision",
          "requiresExactBaseRevision",
          "capturePatch",
          "memoryPatch",
          "commentDecision",
          "safety",
          "comment",
          "serverStorage"
        ],
        "properties": {
          "contractVersion": {
            "type": "integer",
            "const": 1
          },
          "engineVersion": {
            "type": "string",
            "const": "justnoise-backend-v1"
          },
          "operationId": {
            "type": "string",
            "pattern": "^operation-[0-9a-f]{32}$",
            "description": "Deterministic response-level idempotency key."
          },
          "baseMemoryRevision": {
            "type": "integer",
            "minimum": 0
          },
          "nextMemoryRevision": {
            "type": "integer",
            "minimum": 1
          },
          "requiresExactBaseRevision": {
            "type": "boolean",
            "const": true
          },
          "capturePatch": {
            "$ref": "#/components/schemas/CapturePatch"
          },
          "memoryPatch": {
            "$ref": "#/components/schemas/MemoryPatch"
          },
          "commentDecision": {
            "$ref": "#/components/schemas/CommentDecision"
          },
          "safety": {
            "$ref": "#/components/schemas/Safety"
          },
          "comment": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/Comment"
              },
              {
                "type": "null"
              }
            ]
          },
          "serverStorage": {
            "type": "string",
            "const": "none"
          }
        }
      },
      "CapturePatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "captureId",
          "transcript",
          "sourceLanguage",
          "summary",
          "themes",
          "category",
          "emotion",
          "intensity",
          "tension",
          "desire",
          "avoidedAction",
          "currentState",
          "processingStatus",
          "processedAt",
          "strongQuote",
          "clarifiedTranscript",
          "context",
          "highlight",
          "signalStrength"
        ],
        "properties": {
          "captureId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{8,64}$"
